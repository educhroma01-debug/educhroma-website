<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduChroma Analyticals - Practical Pharma Training & Testing</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap');

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
  background-color: #F8FAFC;
  color: #0b2545;
}

/* =========================================
   1. EDUCHROMA COMPLETE NAVIGATION BAR
========================================= */
.ec-navbar,
.ec-navbar * {
  box-sizing: border-box;
}

.ec-navbar {
  width: 100%;
  position: sticky;
  top: 0;
  z-index: 9999;
  background: rgba(255,255,255,.98);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid #e8eef4;
  box-shadow: 0 4px 20px rgba(11,37,69,.05);
  font-family: 'Plus Jakarta Sans', sans-serif;
}

.ec-nav-container {
  max-width: 1320px;
  min-height: 82px;
  margin: auto;
  padding: 10px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
}

.ec-nav-logo {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  text-decoration: none;
}

.ec-nav-logo img {
  display: block;
  width: auto;
  max-width: 205px;
  height: 58px;
  object-fit: contain;
}

.ec-nav-links {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 25px;
}

.ec-nav-links a {
  position: relative;
  text-decoration: none;
  color: #263b55;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  transition: color .25s ease;
}

.ec-nav-links a:not(.ec-nav-contact)::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -8px;
  width: 0;
  height: 2px;
  background: #079f98;
  border-radius: 5px;
  transition: width .25s ease;
}

.ec-nav-links a:hover {
  color: #079f98;
}

.ec-nav-links a:hover::after {
  width: 100%;
}

.ec-nav-links .ec-nav-contact {
  padding: 12px 18px;
  color: #fff;
  background: linear-gradient(135deg,#0b2545,#079f98);
  border-radius: 8px;
  box-shadow: 0 5px 13px rgba(7,159,152,.18);
  transition: transform .25s ease, box-shadow .25s ease;
}

.ec-nav-links .ec-nav-contact:hover {
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(7,159,152,.25);
}

.ec-nav-toggle {
  display: none;
  width: 43px;
  height: 43px;
  border: 1px solid #e2eaf0;
  border-radius: 9px;
  background: #f5f9fb;
  color: #0b2545;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}

.ec-nav-toggle svg {
  width: 23px;
  height: 23px;
}

@media(max-width:1050px) {
  .ec-nav-container {
    min-height: 74px;
    padding: 9px 20px;
  }
  .ec-nav-logo img {
    max-width: 175px;
    height: 52px;
  }
  .ec-nav-toggle {
    display: flex;
    flex-shrink: 0;
  }
  .ec-nav-links {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    padding: 15px 22px 22px;
    background: #fff;
    border-top: 1px solid #edf2f7;
    box-shadow: 0 14px 22px rgba(11,37,69,.09);
    flex-direction: column;
    align-items: stretch;
    gap: 0;
  }
  .ec-nav-links.ec-nav-open {
    display: flex;
  }
  .ec-nav-links a {
    padding: 14px 8px;
    border-bottom: 1px solid #edf2f7;
    font-size: 13px;
  }
  .ec-nav-links a:not(.ec-nav-contact)::after {
    display: none;
  }
  .ec-nav-links .ec-nav-contact {
    margin-top: 13px;
    text-align: center;
    border-bottom: none;
  }
}

@media(max-width:480px) {
  .ec-nav-container {
    padding: 8px 15px;
    min-height: 68px;
  }
  .ec-nav-logo img {
    max-width: 155px;
    height: 46px;
  }
}

/* =========================================
   2. HERO & QUICK ACTION BAR
========================================= */
.ec-main,
.ec-main * {
  box-sizing: border-box;
}

.ec-main {
  width: 100%;
  max-width: 1320px;
  margin: 15px auto 0;
  padding: 0 15px;
  font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
  color: #0b2545;
  overflow: hidden;
}

.ec-hero {
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: .85fr 1.15fr;
  align-items: center;
  gap: 22px;
  padding: 38px 30px;
  border-radius: 22px;
  background:
    radial-gradient(circle at 90% 10%, rgba(20,184,166,.15), transparent 35%),
    linear-gradient(135deg, #f5f9ff, #fff 55%, #edf9f8);
  overflow: hidden;
}

.ec-hero::before {
  content: "";
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: rgba(8,145,178,.08);
  top: -170px;
  left: -100px;
  z-index: -1;
}

.ec-hero::after {
  content: "";
  position: absolute;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  border: 1px solid rgba(8,145,178,.13);
  bottom: -130px;
  right: 32%;
  z-index: -1;
}

.ec-hero-content {
  position: relative;
  z-index: 2;
  animation: ec-slide-in .85s ease both;
}

.ec-hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 9px 15px;
  margin-bottom: 19px;
  border: 1px solid #c9e5f3;
  border-radius: 50px;
  background: rgba(224,242,254,.8);
  color: #12618a;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.ec-hero-badge svg {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
}

.ec-hero h1 {
  margin: 0 0 19px;
  color: #0b2545;
  font-size: clamp(30px, 3.2vw, 44px);
  font-weight: 800;
  line-height: 1.17;
  letter-spacing: -1.5px;
}

.ec-hero h1 span {
  display: block;
  color: #079b96;
}

.ec-hero-description {
  max-width: 590px;
  margin: 0 0 25px;
  color: #536477;
  font-size: 14px;
  line-height: 1.85;
  font-weight: 500;
}

.ec-hero-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.ec-hero-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 48px;
  padding: 12px 21px;
  border-radius: 50px;
  color: #fff !important;
  font-size: 13px;
  font-weight: 800;
  text-decoration: none !important;
  transition: transform .3s ease, box-shadow .3s ease;
}

.ec-hero-btn svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.ec-whatsapp {
  background: linear-gradient(135deg,#12b981,#07966d);
  box-shadow: 0 7px 18px rgba(16,185,129,.22);
}

.ec-inquire {
  background: linear-gradient(135deg,#176de0,#104eaf);
  box-shadow: 0 7px 18px rgba(29,114,232,.2);
}

.ec-hero-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 25px rgba(11,37,69,.18);
}

.ec-hero-image-wrap {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-width: 0;
  padding: 12px;
  animation: ec-image-in 1s ease .15s both;
}

.ec-hero-image-wrap::before {
  content: "";
  position: absolute;
  width: 78%;
  height: 78%;
  border-radius: 50%;
  background: rgba(8,145,178,.18);
  filter: blur(42px);
  animation: ec-glow 4s ease-in-out infinite alternate;
}

.ec-hero-image-frame {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 650px;
  padding: 10px;
  border: 1px solid rgba(255,255,255,.95);
  border-radius: 24px;
  background: rgba(255,255,255,.82);
  box-shadow: 0 22px 55px rgba(11,37,69,.16);
  animation: ec-image-float 5s ease-in-out infinite;
  transition: box-shadow .4s ease;
}

.ec-hero-image-frame:hover {
  box-shadow: 0 30px 65px rgba(11,37,69,.23);
}

.ec-hero-image-frame img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 490px;
  object-fit: contain;
  object-position: center;
  border-radius: 16px;
}

.ec-quick {
  position: relative;
  margin-top: 20px;
  padding: 20px 22px 22px;
  border: 1px solid #dce9f3;
  border-radius: 18px;
  background: linear-gradient(120deg,#f0f7ff,#f0fbfa);
  box-shadow: 0 8px 25px rgba(11,37,69,.045);
  animation: ec-fade-up .8s ease .2s both;
}

.ec-quick-heading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 16px;
  color: #0b2545;
  text-align: center;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

.ec-quick-heading::before,
.ec-quick-heading::after {
  content: "";
  width: 35px;
  height: 2px;
  border-radius: 10px;
  background: #079b96;
  opacity: .55;
}

.ec-quick-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 12px;
}

.ec-quick-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 49px;
  padding: 12px 10px;
  border-radius: 11px;
  font-size: 12px;
  font-weight: 800;
  text-align: center;
  text-decoration: none !important;
  transition: transform .3s ease, box-shadow .3s ease;
}

.ec-quick-btn svg {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
}

.ec-quick-btn:hover {
  transform: translateY(-4px);
}

.ec-explore {
  color: #fff !important;
  background: linear-gradient(135deg,#078d8b,#056c78);
  box-shadow: 0 5px 14px rgba(0,128,128,.17);
}

.ec-testing {
  color: #fff !important;
  background: linear-gradient(135deg,#278b50,#176c3a);
  box-shadow: 0 5px 14px rgba(46,125,50,.16);
}

.ec-brochure {
  color: #0b2545 !important;
  border: 1px solid #c9d9e8;
  background: #fff;
  box-shadow: 0 5px 14px rgba(11,37,69,.06);
}

.ec-brochure:hover {
  border-color: #079b96;
}

@keyframes ec-slide-in {
  from { opacity: 0; transform: translateX(-25px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes ec-image-in {
  from { opacity: 0; transform: translateX(30px) scale(.94); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}
@keyframes ec-image-float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes ec-glow {
  from { opacity: .55; transform: scale(.92); }
  to { opacity: 1; transform: scale(1.08); }
}
@keyframes ec-fade-up {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width:850px) {
  .ec-hero {
    grid-template-columns: .9fr 1.1fr;
    gap: 14px;
    padding: 30px 20px;
  }
  .ec-hero h1 { font-size: 32px; }
  .ec-hero-description { font-size: 13px; }
  .ec-hero-image-frame img { max-height: 390px; }
  .ec-hero-btn { padding: 11px 14px; font-size: 12px; }
}

@media (max-width:600px) {
  .ec-hero {
    grid-template-columns: 1fr;
    gap: 18px;
    padding: 27px 17px;
    border-radius: 17px;
  }
  .ec-hero-content { text-align: center; }
  .ec-hero-badge { font-size: 10px; padding: 8px 12px; }
  .ec-hero h1 { font-size: 31px; letter-spacing: -1px; }
  .ec-hero-description { margin-left: auto; margin-right: auto; font-size: 13px; line-height: 1.75; }
  .ec-hero-buttons { justify-content: center; }
  .ec-hero-btn { min-height: 45px; padding: 11px 15px; font-size: 12px; }
  .ec-hero-image-wrap { padding: 5px 0; }
  .ec-hero-image-frame { max-width: 100%; padding: 7px; border-radius: 18px; }
  .ec-hero-image-frame img { max-height: none; width: 100%; border-radius: 12px; }
  .ec-quick { padding: 17px 12px; border-radius: 15px; }
  .ec-quick-heading { font-size: 10px; letter-spacing: .7px; gap: 7px; }
  .ec-quick-heading::before, .ec-quick-heading::after { width: 18px; }
  .ec-quick-grid { grid-template-columns: 1fr; gap: 9px; }
  .ec-quick-btn { min-height: 46px; font-size: 12px; }
}

/* =========================================
   3. PROGRAMS & SERVICES GRID
========================================= */
.ec-services,
.ec-services * {
  box-sizing: border-box;
}

.ec-services {
  --ec-navy: #0b2545;
  --ec-teal: #079b96;
  --ec-muted: #64748b;
  width: 100%;
  position: relative;
  overflow: hidden;
  margin-top: 25px;
  padding: 48px 22px 45px;
  background:
    radial-gradient(circle at 5% 10%, rgba(8,145,178,.08), transparent 25%),
    radial-gradient(circle at 95% 85%, rgba(16,185,129,.08), transparent 25%),
    linear-gradient(135deg,#f7fbff,#ffffff 55%,#f0fbfa);
  font-family: 'Plus Jakarta Sans','Segoe UI',sans-serif;
  text-align: center;
  border-radius: 20px;
}

.ec-services::before,
.ec-services::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}

.ec-services::before {
  width: 260px;
  height: 260px;
  top: -150px;
  right: -80px;
  border: 1px solid rgba(7,155,150,.16);
  box-shadow: 0 0 0 20px rgba(7,155,150,.025), 0 0 0 42px rgba(7,155,150,.02);
}

.ec-services::after {
  width: 180px;
  height: 180px;
  bottom: -110px;
  left: -70px;
  border: 1px solid rgba(2,132,199,.16);
  box-shadow: 0 0 0 18px rgba(2,132,199,.025), 0 0 0 38px rgba(2,132,199,.02);
}

.ec-service-inner {
  position: relative;
  z-index: 1;
  max-width: 1250px;
  margin: auto;
}

.ec-service-heading {
  margin-bottom: 32px;
  animation: ec-service-heading-in .8s ease both;
}

.ec-service-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
  color: #078b89;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.ec-service-eyebrow::before,
.ec-service-eyebrow::after {
  content: "";
  width: 25px;
  height: 2px;
  border-radius: 5px;
  background: #079b96;
}

.ec-service-heading h2 {
  margin: 0 0 12px;
  color: var(--ec-navy);
  font-size: clamp(25px,3.2vw,36px);
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -1px;
}

.ec-service-heading h2 span {
  color: var(--ec-teal);
}

.ec-service-heading p {
  max-width: 650px;
  margin: auto;
  color: var(--ec-muted);
  font-size: 13px;
  line-height: 1.8;
  font-weight: 500;
}

.ec-service-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 20px;
  text-align: center;
}

.ec-service-card {
  --card-color: #0284c7;
  --card-light: rgba(2,132,199,.10);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 260px;
  padding: 27px 20px 22px;
  overflow: hidden;
  border: 1px solid #e1eaf2;
  border-radius: 18px;
  background: rgba(255,255,255,.94);
  text-decoration: none !important;
  box-shadow: 0 7px 22px rgba(11,37,69,.045);
  transition: transform .4s ease, box-shadow .4s ease, border-color .4s ease;
  animation: ec-card-appear .7s ease both;
}

.ec-service-card:nth-child(1) { animation-delay: .08s; }
.ec-service-card:nth-child(2) { animation-delay: .16s; }
.ec-service-card:nth-child(3) { animation-delay: .24s; }
.ec-service-card:nth-child(4) { animation-delay: .32s; }
.ec-service-card:nth-child(5) { animation-delay: .40s; }
.ec-service-card:nth-child(6) { animation-delay: .48s; }

.ec-service-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg,var(--card-color),#19c4b6);
  transform: scaleX(.25);
  transform-origin: left;
  transition: transform .4s ease;
}

.ec-service-card::after {
  content: "";
  position: absolute;
  width: 145px;
  height: 145px;
  right: -75px;
  top: -75px;
  border-radius: 50%;
  background: var(--card-light);
  transition: transform .5s ease;
  pointer-events: none;
}

.ec-service-card:hover {
  transform: translateY(-9px);
  border-color: rgba(7,155,150,.35);
  box-shadow: 0 18px 38px rgba(11,37,69,.11);
}

.ec-service-card:hover::before { transform: scaleX(1); }
.ec-service-card:hover::after { transform: scale(1.8); }

.ec-service-icon {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 62px;
  height: 62px;
  margin-bottom: 18px;
  color: #fff;
  background: linear-gradient(135deg,var(--card-color),#19b8ae);
  border-radius: 19px;
  box-shadow: 0 9px 20px var(--card-light);
  transition: transform .45s ease, border-radius .45s ease;
}

.ec-service-icon svg { width: 28px; height: 28px; }

.ec-service-card:hover .ec-service-icon {
  transform: translateY(-4px) rotate(-7deg) scale(1.08);
  border-radius: 50%;
}

.ec-service-title {
  position: relative;
  z-index: 1;
  margin: 0 0 9px;
  color: var(--ec-navy);
  font-size: 16px;
  line-height: 1.4;
  font-weight: 800;
}

.ec-service-desc {
  position: relative;
  z-index: 1;
  max-width: 290px;
  margin: 0 auto 17px;
  color: #64748b;
  font-size: 12px;
  line-height: 1.75;
  font-weight: 500;
}

.ec-service-link {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: auto;
  color: var(--card-color);
  font-size: 12px;
  font-weight: 800;
  transition: gap .3s ease;
}

.ec-service-link span { font-size: 17px; line-height: 1; }
.ec-service-card:hover .ec-service-link { gap: 13px; }

.ec-card-training { --card-color: #0284c7; --card-light: rgba(2,132,199,.12); }
.ec-card-testing { --card-color: #008b88; --card-light: rgba(0,139,136,.12); }
.ec-card-internship { --card-color: #10a875; --card-light: rgba(16,168,117,.12); }
.ec-card-research { --card-color: #8055d8; --card-light: rgba(128,85,216,.12); }
.ec-card-consultancy { --card-color: #d58a12; --card-light: rgba(213,138,18,.13); }
.ec-card-faculty { --card-color: #059669; --card-light: rgba(5,150,105,.12); }

.ec-service-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin-top: 28px;
  color: #52677c;
  font-size: 12px;
  font-weight: 600;
  animation: ec-card-appear .8s ease .5s both;
}

.ec-service-footer svg { width: 17px; height: 17px; color: #079b96; flex-shrink: 0; }

@keyframes ec-service-heading-in {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ec-card-appear {
  from { opacity: 0; transform: translateY(22px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width:850px) {
  .ec-services { padding: 38px 16px; }
  .ec-service-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 15px; }
  .ec-service-card { min-height: 245px; padding: 24px 15
