
<!-- =========================================
     EDUCHROMA COMPLETE NAVIGATION BAR
========================================= -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

.ec-navbar,
.ec-navbar * {
  box-sizing: border-box;
}

.ec-navbar {
  width: 100%;
  position: sticky;
  top: 0;
  z-index: 9999;
  background: rgba(255,255,255,.98);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid #e8eef4;
  box-shadow: 0 4px 20px rgba(11,37,69,.05);
  font-family: 'Plus Jakarta Sans', sans-serif;
}

.ec-nav-container {
  max-width: 1320px;
  min-height: 82px;
  margin: auto;
  padding: 10px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
}

/* LOGO */
.ec-nav-logo {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  text-decoration: none;
}

.ec-nav-logo img {
  display: block;
  width: auto;
  max-width: 205px;
  height: 58px;
  object-fit: contain;
}

/* DESKTOP MENU */
.ec-nav-links {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 25px;
}

.ec-nav-links a {
  position: relative;
  text-decoration: none;
  color: #263b55;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  transition: color .25s ease;
}

.ec-nav-links a:not(.ec-nav-contact)::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -8px;
  width: 0;
  height: 2px;
  background: #079f98;
  border-radius: 5px;
  transition: width .25s ease;
}

.ec-nav-links a:hover {
  color: #079f98;
}

.ec-nav-links a:hover::after {
  width: 100%;
}

/* CONTACT BUTTON */
.ec-nav-links .ec-nav-contact {
  padding: 12px 18px;
  color: #fff;
  background: linear-gradient(135deg,#0b2545,#079f98);
  border-radius: 8px;
  box-shadow: 0 5px 13px rgba(7,159,152,.18);
  transition: transform .25s ease, box-shadow .25s ease;
}

.ec-nav-links .ec-nav-contact:hover {
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(7,159,152,.25);
}

/* MOBILE BUTTON */
.ec-nav-toggle {
  display: none;
  width: 43px;
  height: 43px;
  border: 1px solid #e2eaf0;
  border-radius: 9px;
  background: #f5f9fb;
  color: #0b2545;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}

.ec-nav-toggle svg {
  width: 23px;
  height: 23px;
}

/* TABLET AND MOBILE */
@media(max-width:1050px) {
  .ec-nav-container {
    min-height: 74px;
    padding: 9px 20px;
  }

  .ec-nav-logo img {
    max-width: 175px;
    height: 52px;
  }

  .ec-nav-toggle {
    display: flex;
    flex-shrink: 0;
  }

  .ec-nav-links {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    padding: 15px 22px 22px;
    background: #fff;
    border-top: 1px solid #edf2f7;
    box-shadow: 0 14px 22px rgba(11,37,69,.09);
    flex-direction: column;
    align-items: stretch;
    gap: 0;
  }

  .ec-nav-links.ec-nav-open {
    display: flex;
  }

  .ec-nav-links a {
    padding: 14px 8px;
    border-bottom: 1px solid #edf2f7;
    font-size: 13px;
  }

  .ec-nav-links a:not(.ec-nav-contact)::after {
    display: none;
  }

  .ec-nav-links .ec-nav-contact {
    margin-top: 13px;
    text-align: center;
    border-bottom: none;
  }
}

@media(max-width:480px) {
  .ec-nav-container {
    padding: 8px 15px;
    min-height: 68px;
  }

  .ec-nav-logo img {
    max-width: 155px;
    height: 46px;
  }
}
</style>

<header class="ec-navbar">
  <div class="ec-nav-container">

    <!-- EDUCHROMA LOGO -->
    <a href="#home" class="ec-nav-logo">
      <img
        src="ADD_YOUR_EDUCHROMA_LOGO_LINK"
        alt="EduChroma Analyticals">
    </a>

    <!-- MOBILE MENU BUTTON -->
    <button class="ec-nav-toggle"
      type="button"
      aria-label="Open navigation menu"
      aria-expanded="false">

      <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <!-- NAVIGATION -->
    <nav class="ec-nav-links">
      <a href="#home">HOME</a>
      <a href="#about">ABOUT</a>
      <a href="#training">TRAINING</a>
      <a href="#testing">TESTING SERVICES</a>
      <a href="#research">RESEARCH</a>
      <a href="#gallery">GALLERY</a>
      <a href="#contact" class="ec-nav-contact">CONTACT US</a>
    </nav>

  </div>
</header>

<script>
(function () {
  const navbar = document.querySelector('.ec-navbar');
  if (!navbar) return;

  const toggle = navbar.querySelector('.ec-nav-toggle');
  const menu = navbar.querySelector('.ec-nav-links');

  toggle.addEventListener('click', function () {
    const isOpen = menu.classList.toggle('ec-nav-open');

    toggle.setAttribute('aria-expanded', isOpen);
    toggle.setAttribute(
      'aria-label',
      isOpen ? 'Close navigation menu' : 'Open navigation menu'
    );
  });

  menu.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', function () {
      menu.classList.remove('ec-nav-open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  });
})();
</script>
